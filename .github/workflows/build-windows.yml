name: Build Windows Executable

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build executable with PyInstaller
        run: |
          pyinstaller dataflow.spec
      
      - name: Verify build
        run: |
          if (Test-Path dist/dataflow/dataflow.exe) {
            Write-Host "✅ Build successful - dataflow.exe created"
            $fileInfo = Get-Item dist/dataflow/dataflow.exe
            Write-Host "Executable size: $([math]::Round($fileInfo.Length / 1MB, 2)) MB"
            $folderSize = (Get-ChildItem dist/dataflow -Recurse | Measure-Object -Property Length -Sum).Sum
            Write-Host "Total distribution size: $([math]::Round($folderSize / 1MB, 2)) MB"
            
            # Verify Tcl/Tk was included
            if (Test-Path dist/dataflow/_internal/tcl) {
              Write-Host "✅ Tcl/Tk runtime included"
            } else {
              Write-Warning "⚠️  Tcl/Tk runtime not found - GUI may not work"
            }
          } else {
            Write-Error "❌ Build failed - dataflow.exe not found"
            exit 1
          }
        shell: pwsh
      
      - name: Create distribution archive
        run: |
          Compress-Archive -Path dist/dataflow/* -DestinationPath dataflow-windows.zip
        shell: pwsh
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dataflow-windows
          path: dataflow-windows.zip
          retention-days: 30
      
      - name: Create release (if tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dataflow-windows.zip
          draft: false
          prerelease: false
          body: |
            ## Windows Distribution
            
            Download `dataflow-windows.zip` and extract it.
            Run `dataflow.exe` from inside the extracted `dataflow` folder.
            
            **Note**: This is a one-folder distribution. The entire folder must be kept together.
            
            ### Contents
            - `dataflow.exe` - Main executable
            - `_internal/` - Python runtime, libraries, and Tcl/Tk
            - `add_data/` - Application resources
            - `locale/` - Translations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

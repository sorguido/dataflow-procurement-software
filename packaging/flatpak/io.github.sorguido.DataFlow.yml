# Draft Flatpak manifest for DataFlow.
#
# This is intentionally not Flathub-ready. It is a readable starting point for
# local packaging experiments and keeps all application code unchanged.
app-id: io.github.sorguido.DataFlow
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: dataflow

# The Freedesktop runtime can provide a minimal Tk build that does not link
# against Xft/fontconfig/freetype. DataFlow needs normal desktop font discovery,
# so this draft bundles Tcl/Tk 8.6.14 in /app and the launcher prefers /app/lib.

finish-args:
  # Tk is commonly safest on X11. Wayland support should be tested separately.
  - --share=ipc
  - --socket=x11
  # TODO: Enable only after testing Tk behavior on Wayland.
  # - --socket=wayland


  # Keep filesystem permissions conservative for the first draft.
  # TODO: DataFlow import/export/backup/attachments may require additional
  # filesystem access or portal integration. Avoid broad permissions unless a
  # test case proves they are needed.
  # - --filesystem=xdg-documents:create
  # - --filesystem=home

modules:
  - name: tcl
    buildsystem: simple
    build-commands:
      - cd unix && ./configure --prefix=/app --enable-shared --enable-threads --mandir=/app/share/man
      - cd unix && make
      - cd unix && make install
      - chmod 755 /app/lib/libtcl8.6.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tcl8.6.14-src.tar.gz
        sha256: 5880225babf7954c58d4fb0f5cf6279104ce1cd6aa9b71e9a6322540e1c4de66

  - name: tk
    buildsystem: simple
    build-commands:
      # --enable-xft should make Tk use Xft/fontconfig/freetype instead of the
      # tiny core-X11 font path that causes TkDefaultFont to become "fixed".
      - cd unix && ./configure --prefix=/app --with-tcl=/app/lib --enable-shared --enable-threads --enable-xft --mandir=/app/share/man
      - cd unix && make
      - cd unix && make install
      - chmod 755 /app/lib/libtk8.6.so
      - sh -c 'ldd /app/lib/libtk8.6.so > /tmp/dataflow-tk-ldd.txt && grep -q libXft /tmp/dataflow-tk-ldd.txt && grep -q libfontconfig /tmp/dataflow-tk-ldd.txt && grep -q libfreetype /tmp/dataflow-tk-ldd.txt && grep -q libXrender /tmp/dataflow-tk-ldd.txt'
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/tcl/tk8.6.14-src.tar.gz
        sha256: 8ffdb720f47a6ca6107eac2dd877e30b0ef7fac14f3a84ebbd0b3612cee41a94

  - python3-requirements.json

  - name: dataflow
    buildsystem: simple
    build-commands:
      - install -Dm755 packaging/flatpak/run-dataflow.sh /app/bin/dataflow
      - install -d /app/share/dataflow
      - cp -a dataflow.py constants.py database_manager.py /app/share/dataflow/
      - cp -a services database models ui utils add_data locale /app/share/dataflow/
      - install -Dm644 LICENSE /app/share/licenses/io.github.sorguido.DataFlow/LICENSE
      - install -Dm644 README.md /app/share/doc/io.github.sorguido.DataFlow/README.md
      - install -Dm644 packaging/flatpak/io.github.sorguido.DataFlow.desktop /app/share/applications/io.github.sorguido.DataFlow.desktop
      - install -Dm644 packaging/flatpak/io.github.sorguido.DataFlow.metainfo.xml /app/share/metainfo/io.github.sorguido.DataFlow.metainfo.xml
      - install -Dm644 add_data/Logo_256x256.png /app/share/icons/hicolor/256x256/apps/io.github.sorguido.DataFlow.png
    sources:
      # Path is intended to resolve from this manifest directory to the repo root.
      # If flatpak-builder is invoked differently, adjust the path locally.
      - type: dir
        path: ../..
